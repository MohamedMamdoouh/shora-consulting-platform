<section class="page page--full services">
  <app-page-header [title]="copy.services.title" [description]="copy.services.intro" />

  @if (settings(); as settings) {
    <app-featured-session-card
      [sessionPrice]="settings.sessionPrice"
      [sessionDurationMinutes]="settings.sessionDurationMinutes"
    />
  }

  <section class="section section--topics">
    <header class="section__centered-header">
      <h2 class="section__title">{{ copy.services.topicsHeading }}</h2>
      <p class="section__subtitle">{{ copy.services.topicsSubtitle }}</p>
    </header>

    <div class="topics-grid">
      @for (topic of topics; track topic.id) {
        <app-topic-card
          [topic]="topic"
          [description]="topic.longDescription"
          [showDiscoverLink]="true"
        />
      }
    </div>
  </section>

  <section class="section section--info">
    <h2 class="section-heading">{{ copy.services.paymentHeading }}</h2>
    <div class="info-block">
      <p>{{ copy.services.paymentBody }}</p>
    </div>
  </section>

  <section class="section section--info">
    <h2 class="section-heading">{{ copy.services.privacyHeading }}</h2>
    <div class="info-block">
      <p>{{ copy.services.privacyBody }}</p>
    </div>
  </section>

  <app-footer-cta-banner />
</section>
