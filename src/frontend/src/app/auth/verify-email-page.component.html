<div class="auth-page">
<section class="auth-card">
  <a routerLink="/" class="auth-brand" aria-label="شورى — الرئيسية">
    <img src="logo.svg" alt="شورى" width="96" height="24" />
  </a>
  <h1>تأكيد البريد الإلكتروني</h1>

  <div
    class="auth-banner"
    [class.auth-banner--success]="status === 'success'"
    [class.auth-banner--error]="status === 'error'"
  >
    @if (status === 'loading') {
      <p>جاري التحقق...</p>
    } @else {
      <p>{{ message }}</p>
    }
  </div>

  <div class="auth-links">
    <a routerLink="/auth/login">العودة لتسجيل الدخول</a>
  </div>
</section>
</div>
