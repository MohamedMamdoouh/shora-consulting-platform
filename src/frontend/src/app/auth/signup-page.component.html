<div class="auth-page">
<section class="auth-card">
  <h1>إنشاء حساب</h1>

  @if (errorMessage) {
    <p class="auth-error">{{ errorMessage }}</p>
  }

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <label>
      البريد الإلكتروني
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
      />
      @if (getFieldError(form.controls.email, 'email'); as fieldError) {
        <span class="auth-field-error" role="alert">{{ fieldError }}</span>
      }
    </label>

    <label>
      كلمة المرور
      <input
        type="password"
        formControlName="password"
        autocomplete="new-password"
        [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
      />
      @if (getFieldError(form.controls.password, 'password'); as fieldError) {
        <span class="auth-field-error" role="alert">{{ fieldError }}</span>
      }
    </label>

    <label>
      الاسم المعروض (اختياري)
      <input type="text" formControlName="displayName" autocomplete="nickname" />
    </label>

    <button type="submit" class="btn" [disabled]="form.invalid || isSubmitting">
      {{ isSubmitting ? 'جاري التسجيل…' : 'تسجيل' }}
    </button>
  </form>

  <div class="auth-links">
    <a [routerLink]="['/auth/login']" [queryParams]="authQueryParams">لديك حساب؟ سجل الدخول</a>
  </div>
</section>
</div>
