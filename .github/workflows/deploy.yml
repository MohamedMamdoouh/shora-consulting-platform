name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build publish artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build frontend
        working-directory: src/frontend
        run: |
          npm ci
          npm run build

      - name: Copy static files to wwwroot
        run: |
          find src/backend/Shora.Api/wwwroot -mindepth 1 ! -name '.gitkeep' -delete
          cp -r src/frontend/dist/shora-web/browser/. src/backend/Shora.Api/wwwroot/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            src/backend/**/*.csproj

      - name: Publish API
        working-directory: src/backend
        run: dotnet publish Shora.Api/Shora.Api.csproj -c Release -o "${{ github.workspace }}/publish"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shora-publish
          path: publish/
          retention-days: 7

  deploy:
    name: Deploy to Railway
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: ${{ vars.DEPLOY_ENVIRONMENT || 'production' }}
    outputs:
      production_url: ${{ steps.deploy-meta.outputs.production_url }}
    env:
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - id: deploy-meta
        run: echo "production_url=${PRODUCTION_URL}" >> "$GITHUB_OUTPUT"

      - name: Require Railway configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_SERVICE_ID" ]; then
            echo "::error::RAILWAY_SERVICE_ID repository variable is not set. See docs/railway-prerequisites.md"
            exit 1
          fi
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error::PRODUCTION_URL repository variable is not set (e.g. https://your-app.up.railway.app)."
            exit 1
          fi
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set on the production environment."
            exit 1
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: shora-publish
          path: ./publish

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare container image tag
        id: image
        run: echo "tag=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):production" >> "$GITHUB_OUTPUT"

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}

      - name: Redeploy on Railway
        run: npx -y @railway/cli@latest redeploy --service "$RAILWAY_SERVICE_ID" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  smoke-test:
    name: Post-deploy smoke test
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ needs.deploy.result == 'success' && needs.deploy.outputs.production_url != '' }}
    env:
      BASE_URL: ${{ needs.deploy.outputs.production_url }}
    steps:
      - name: Wait for app startup
        run: sleep 45

      - name: Verify API health
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf "$BASE_URL/api/v1/health" | grep -q healthy; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 20
          done
          echo "::error::Health check failed at $BASE_URL/api/v1/health"
          exit 1

      - name: Verify SPA shell
        run: |
          curl -sf "$BASE_URL/" | grep -q 'app-root'
          curl -sf "$BASE_URL/about" | grep -q 'app-root'
