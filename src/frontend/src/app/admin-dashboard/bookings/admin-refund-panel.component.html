<div class="refund-panel-backdrop" (click)="close()">
  <section
    class="refund-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="refund-record-title"
    (click)="$event.stopPropagation()"
  >
    <header class="refund-panel__header">
      <div>
        <h3 id="refund-record-title">تسجيل استرداد يدوي</h3>
        <p class="refund-panel__subtitle">
          {{ copy.admin.customerName(item.clientDisplayName) }}
        </p>
      </div>
      <button type="button" class="refund-panel__close" (click)="close()" aria-label="إغلاق">
        ×
      </button>
    </header>

    <p class="refund-panel__hint">
      أرسل المبلغ للعميل عبر فودافون كاش أو إنستا باي خارج النظام، ثم سجل مرجع التحويل هنا.
      سيصله بريد إلكتروني لتأكيد الاسترداد.
    </p>

    <form class="refund-panel__form" [formGroup]="recordForm" (ngSubmit)="submitRecord()">
      <label>
        مرجع التحويل
        <input
          type="text"
          formControlName="reference"
          maxlength="500"
          autocomplete="off"
          (blur)="markReferenceTouched()"
          [class.field-invalid]="!!referenceError()"
          [attr.aria-invalid]="referenceTouched() && !hasReference() ? 'true' : null"
          [attr.aria-describedby]="referenceError() ? 'refund-reference-error' : null"
        />
        @if (referenceError(); as error) {
          <span id="refund-reference-error" class="field-error" role="alert">{{ error }}</span>
        }
      </label>

      <label>
        ملاحظة (اختياري)
        <textarea formControlName="note" rows="3" placeholder="مثال: استرداد عبر فودافون كاش"></textarea>
      </label>

      <div class="refund-panel__actions">
        <button type="submit" class="btn" [disabled]="!hasReference() || isSubmitting()">
          {{ isSubmitting() ? 'جاري التسجيل...' : 'تسجيل الاسترداد' }}
        </button>
        <button type="button" class="btn btn--secondary" [disabled]="isSubmitting()" (click)="close()">
          إلغاء
        </button>
      </div>
    </form>
  </section>
</div>
