<div class="auth-page">
<section class="auth-card">
  <h1>نسيت كلمة المرور</h1>

  @if (submitted()) {
    <div class="auth-banner auth-banner--success">
      <p>إذا كان هناك حساب بهذا البريد، فقد أرسلنا رابط إعادة التعيين.</p>
    </div>
  } @else {
    @if (errorMessage()) {
      <div class="auth-banner auth-banner--error" role="alert">{{ errorMessage() }}</div>
    }

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label>
        البريد الإلكتروني
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
        />
        @if (getFieldError(form.controls.email, 'email'); as fieldError) {
          <span class="auth-field-error" role="alert">{{ fieldError }}</span>
        }
      </label>
      <button type="submit" class="btn" [disabled]="form.invalid || isSubmitting()">
        {{ isSubmitting() ? 'جاري الإرسال…' : 'إرسال الرابط' }}
      </button>
    </form>
  }

  <div class="auth-links">
    <a routerLink="/auth/login">العودة لتسجيل الدخول</a>
  </div>
</section>
</div>
