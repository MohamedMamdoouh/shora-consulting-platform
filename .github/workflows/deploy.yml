name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build publish artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Apply Google Client ID (build-time)
        if: vars.GOOGLE_CLIENT_ID != ''
        working-directory: src/frontend
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          sed -i "s/googleClientId: .*/googleClientId: '${GOOGLE_CLIENT_ID}',/" src/environments/environment.production.ts

      - name: Build frontend
        working-directory: src/frontend
        run: |
          npm ci
          npm run build

      - name: Copy static files to wwwroot
        run: |
          find src/backend/Shora.Api/wwwroot -mindepth 1 ! -name '.gitkeep' -delete
          cp -r src/frontend/dist/shora-web/browser/. src/backend/Shora.Api/wwwroot/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            src/backend/**/*.csproj

      - name: Publish API
        working-directory: src/backend
        run: dotnet publish Shora.Api/Shora.Api.csproj -c Release -o "${{ github.workspace }}/publish"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shora-publish
          path: publish/
          retention-days: 7

  deploy:
    name: Deploy to Azure
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ vars.DEPLOY_ENVIRONMENT || 'production' }}
    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
    steps:
      - name: Require Azure configuration
        run: |
          if [ -z "$AZURE_WEBAPP_NAME" ]; then
            echo "::error::AZURE_WEBAPP_NAME repository variable is not set. Add it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: shora-publish
          path: ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

  smoke-test:
    name: Post-deploy smoke test
    needs: deploy
    runs-on: ubuntu-latest
    if: vars.AZURE_WEBAPP_NAME != ''
    env:
      BASE_URL: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: Wait for app startup
        run: sleep 30

      - name: Verify API health
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf "$BASE_URL/api/v1/health" | grep -q healthy; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 15
          done
          echo "::error::Health check failed at $BASE_URL/api/v1/health"
          exit 1

      - name: Verify SPA shell
        run: |
          curl -sf "$BASE_URL/" | grep -q 'app-root'
          curl -sf "$BASE_URL/about" | grep -q 'app-root'
