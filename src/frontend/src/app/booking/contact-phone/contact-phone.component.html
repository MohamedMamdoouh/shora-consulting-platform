<section class="page">
  <article class="section">
    <h1>رقم الهاتف</h1>
    <p class="intro">أدخل رقم الموبايل الذي سيتصل بك المستشار عليه.</p>

    <div class="slot-summary">
      <span class="slot-summary__label">الموعد المختار</span>
      <strong>{{ slotSummary }}</strong>
    </div>

    <form class="phone-form" [formGroup]="form" (ngSubmit)="submit()">
      <label>
        رقم الموبايل
        <input
          type="tel"
          formControlName="contactPhone"
          autocomplete="tel"
          inputmode="tel"
          placeholder="01012345678"
          [attr.aria-invalid]="form.controls.contactPhone.touched && form.controls.contactPhone.invalid"
        />
        @if (phoneError(); as error) {
          <span class="field-error" role="alert">{{ error }}</span>
        }
      </label>

      <button type="submit" class="btn">متابعة</button>
    </form>

    <a routerLink="/booking/delivery" class="back-link">← تغيير طريقة التواصل</a>
  </article>
</section>
