<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{BrandName}}</title>
  </head>
  <body dir="rtl" style="margin:0;padding:0;background-color:#fdfbf7;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;color:#1a2e2a;direction:rtl;text-align:right">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" dir="rtl" style="background-color:#fdfbf7;padding:40px 16px;direction:rtl">
      <tr>
        <td align="center">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" dir="rtl" style="max-width:520px;background-color:#ffffff;border:1px solid #e5ebe8;border-radius:16px;overflow:hidden;direction:rtl;text-align:right">
            <tr>
              <td style="height:3px;background-color:#7a9e8e;font-size:0;line-height:0">&nbsp;</td>
            </tr>
            <tr>
              <td dir="rtl" style="padding:28px 28px 16px;text-align:center;direction:rtl">{{BrandHeader}}</td>
            </tr>
            <tr>
              <td dir="rtl" style="padding:20px 28px 8px;font-size:15px;line-height:1.75;color:#1a2e2a;direction:rtl;text-align:right">
                <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#5c7268;direction:rtl;text-align:right">مرحبًا {{RecipientName}}،</p>
                {{BodyHtml}}
              </td>
            </tr>
            <tr>
              <td dir="rtl" style="padding:8px 28px 28px;text-align:center;direction:rtl">
                <a href="{{ActionUrl}}" style="display:inline-block;min-width:200px;padding:14px 24px;background-color:#1a3a3a;color:#ffffff;text-decoration:none;border-radius:10px;font-size:15px;font-weight:600;font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif">{{ActionLabel}}</a>
              </td>
            </tr>
            <tr>
              <td dir="rtl" style="padding:0 28px 24px;font-size:14px;line-height:1.65;color:#5c7268;text-align:right;border-top:1px solid #e5ebe8;direction:rtl">
                <p style="margin:20px 0 0;direction:rtl;text-align:right">{{FooterNote}}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
