<div class="auth-page">
<section class="auth-card">
  <a routerLink="/" class="auth-brand" aria-label="شورى — الرئيسية">
    <img src="logo.svg" alt="شورى" />
  </a>
  <h1>إعادة تعيين كلمة المرور</h1>

  @if (success) {
    <div class="auth-banner auth-banner--success">
      <p>تم تحديث كلمة المرور. يمكنك تسجيل الدخول الآن.</p>
    </div>
  } @else {
    @if (errorMessage) {
      <p class="auth-error">{{ errorMessage }}</p>
    }

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label>
        كلمة المرور الجديدة
        <input
          type="password"
          formControlName="newPassword"
          autocomplete="new-password"
          [attr.aria-invalid]="form.controls.newPassword.touched && form.controls.newPassword.invalid"
        />
        @if (getFieldError(form.controls.newPassword, 'newPassword'); as fieldError) {
          <span class="auth-field-error" role="alert">{{ fieldError }}</span>
        }
      </label>
      <button type="submit" class="btn" [disabled]="form.invalid || isSubmitting">
        {{ isSubmitting ? 'جاري الحفظ…' : 'حفظ' }}
      </button>
    </form>
  }

  <div class="auth-links">
    <a routerLink="/auth/login">العودة لتسجيل الدخول</a>
  </div>
</section>
</div>
