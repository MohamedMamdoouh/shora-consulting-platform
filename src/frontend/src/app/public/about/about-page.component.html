<section class="page about">
  <app-page-header [title]="copy.about.title" />

  <article class="section">
    <blockquote class="pull-quote">
      <p>{{ copy.about.quote }}</p>
    </blockquote>
  </article>

  <article class="section">
    <h2 class="section-heading">{{ copy.about.whoHeading }}</h2>
    <p>{{ copy.about.whoParagraph1 }}</p>
  </article>

  <article class="section about__approach">
    <h2 class="section-heading">{{ copy.about.approachHeading }}</h2>
    <ul class="about__approach-list">
      @for (item of copy.about.approachItems; track item.title) {
        <li class="about__approach-item">
          <h3 class="about__approach-item-title">{{ item.title }}</h3>
          <p class="about__approach-item-body">{{ item.body }}</p>
        </li>
      }
    </ul>
  </article>

  <app-footer-cta-banner />
</section>
