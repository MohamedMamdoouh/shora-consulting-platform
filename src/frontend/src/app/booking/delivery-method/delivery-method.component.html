<section class="page booking-flow">
  <app-booking-step-indicator currentStep="delivery" [showPhoneStep]="false" />

  <article class="section section--card">
    <h1 class="section-heading">طريقة التواصل</h1>
    <p class="intro">كيف تفضل إجراء الجلسة؟</p>

    <div class="slot-summary">
      <span class="slot-summary__label">الموعد المختار</span>
      <strong>{{ slotSummary }}</strong>
    </div>

    <div class="choice-list">
      <button type="button" class="choice-card choice-card--voice" (click)="selectDeliveryMethod('VoiceCall')">
        <span class="choice-card__icon" aria-hidden="true"></span>
        <span class="choice-card__title">مكالمة صوتية</span>
        <span class="choice-card__detail">{{ copy.booking.voiceDetail }}</span>
      </button>

      <button type="button" class="choice-card choice-card--chat" (click)="selectDeliveryMethod('Chat')">
        <span class="choice-card__icon" aria-hidden="true"></span>
        <span class="choice-card__title">محادثة واتساب</span>
        <span class="choice-card__detail">ستبدأ المحادثة عبر رابط واتساب في الموعد المحدد.</span>
      </button>
    </div>

    <a routerLink="/booking/start" class="back-link">← تغيير الموعد</a>
  </article>
</section>
