<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{Heading}}</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #faf6f2;
      font-family: &quot;Segoe UI&quot;, Tahoma, Arial, sans-serif;
      color: #2c241c;
    "
  >
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0">
      {{PreviewText}}
    </div>
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="100%"
      style="background-color: #faf6f2; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="100%"
            style="
              max-width: 560px;
              background-color: #ffffff;
              border: 1px solid #e8ddd4;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <tr>
              <td
                style="
                  padding: 28px 32px 12px;
                  text-align: center;
                  background-color: #ffffff;
                "
              >
                {{BrandHeader}}
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 32px 0">
                <h1
                  style="
                    margin: 0 0 16px;
                    font-size: 24px;
                    line-height: 1.4;
                    color: #2c241c;
                    text-align: center;
                  "
                >
                  {{Heading}}
                </h1>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 0 32px 24px;
                  font-size: 16px;
                  line-height: 1.7;
                  color: #2c241c;
                "
              >
                {{Content}}
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 32px; text-align: center">
                <a
                  href="{{ActionUrl}}"
                  style="
                    display: inline-block;
                    padding: 14px 28px;
                    background-color: #4a5748;
                    color: #ffffff;
                    text-decoration: none;
                    border-radius: 8px;
                    font-size: 16px;
                    font-weight: 600;
                  "
                  >{{ActionLabel}}</a
                >
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 0 32px 24px;
                  font-size: 14px;
                  line-height: 1.6;
                  color: #6b5e54;
                  text-align: center;
                "
              >
                {{FooterNote}}
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 32px;
                  border-top: 1px solid #e8ddd4;
                  background-color: #faf6f2;
                  font-size: 12px;
                  line-height: 1.6;
                  color: #6b5e54;
                  text-align: center;
                "
              >
                <p style="margin: 0">&copy; {{Year}} {{BrandName}}</p>
                <p style="margin: 8px 0 0">
                  إذا لم يعمل الزر، انسخ الرابط التالي إلى المتصفح:
                </p>
                <p style="margin: 8px 0 0; word-break: break-all">
                  <a href="{{ActionUrl}}" style="color: #4a5748"
                    >{{ActionUrl}}</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
